<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX Prime - Absolute Leaderboard Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #00f2fe;
            --secondary: #fb406c;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --white: #ffffff;
        }

        * { box-sizing: border-box; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            color: var(--white); overflow: hidden; 
        }

        .app-container { 
            width: 95%; max-width: 420px; height: 92vh; max-height: 850px; background: var(--glass); 
            backdrop-filter: blur(25px); border: 1px solid var(--glass-border); 
            border-radius: 40px; padding: 25px; display: flex; flex-direction: column; 
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.6); 
        }

        .screen { 
            display: none; flex-direction: column; align-items: center; 
            width: 100%; height: 100%; animation: fadeIn 0.4s forwards; 
            overflow-y: auto; padding-bottom: 20px; 
        }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.5rem; margin: 10px 0; background: linear-gradient(#fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 5px; font-weight: 800; text-align: center; }
        h2 { color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; margin: 15px 0; text-align: center; }
        
        .btn { 
            width: 100%; padding: 16px; margin: 8px 0; border-radius: 20px; 
            border: 1px solid var(--glass-border); font-size: 1rem; font-weight: 700; 
            cursor: pointer; background: var(--glass); color: white; 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
        }
        .btn-primary { background: linear-gradient(45deg, #4facfe, #00f2fe); color: #000; border: none; box-shadow: 0 10px 20px rgba(0,242,254,0.2); }
        .btn-secondary { border-color: var(--secondary); color: var(--secondary); }
        .btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

        input { 
            width: 100%; padding: 15px; background: rgba(0,0,0,0.4); 
            border: 1px solid var(--glass-border); border-radius: 18px; 
            color: white; margin-bottom: 15px; font-family: inherit; font-size: 1rem;
        }

        .user-card { 
            width: 100%; display: flex; align-items: center; gap: 15px; 
            margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); 
            border-radius: 25px; border: 1px solid var(--glass-border); 
        }
        .ava-frame { 
            width: 55px; height: 55px; background: var(--accent); 
            border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 1.8rem; box-shadow: 0 0 15px var(--accent);
        }

        .lb-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .lb-row { 
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 22px; 
            display: flex; align-items: center; gap: 15px; border: 1px solid var(--glass-border);
            position: relative;
        }
        .lb-row.highlight { border-color: var(--accent); background: rgba(0, 242, 254, 0.05); }
        .rank-badge { 
            width: 32px; height: 32px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; font-size: 0.9rem;
        }
        .rank-1 { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }
        .rank-2 { background: var(--silver); color: #000; }
        .rank-3 { background: var(--bronze); color: #000; }
        .rank-other { background: var(--glass); color: #fff; }

        .game-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
            width: 100%; max-width: 300px; margin: 20px 0; 
        }
        .tile { 
            aspect-ratio: 1/1; background: var(--glass); border-radius: 20px; 
            border: 1px solid var(--glass-border); display: flex; 
            align-items: center; justify-content: center; font-size: 2.5rem; 
            font-weight: 900; cursor: pointer;
        }
        .tile.x { color: var(--accent); text-shadow: 0 0 20px var(--accent); }
        .tile.o { color: var(--secondary); text-shadow: 0 0 20px var(--secondary); }

        .chat-box { 
            width: 100%; background: rgba(0,0,0,0.3); border-radius: 25px; 
            padding: 15px; height: 160px; display: flex; flex-direction: column; 
            margin-top: 10px; border: 1px solid var(--glass-border);
        }
        .chat-view { flex: 1; overflow-y: auto; font-size: 0.85rem; padding-right: 5px; }

        .full-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); border-radius: 40px; z-index: 5000; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="overlay-result" class="full-overlay">
            <h1 id="win-status">VICTORY!</h1>
            <p id="reward-exp" style="color: var(--gold); font-size: 1.2rem;"></p>
            <button class="btn btn-primary" style="width: 200px; margin-top: 20px;" onclick="exitToMenu()">LANJUTKAN</button>
        </div>

        <div id="scr-login" class="screen active">
            <h1 style="margin-top: 80px;">XOX PRIME</h1>
            <p style="opacity: 0.6; text-align: center;">Masukan / Daftar Akun Anda !!</p>
            <div style="width: 100%; margin-top: 50px;">
                <input type="text" id="login-user" placeholder="Username">
                <input type="password" id="login-pass" placeholder="Password">
                <button class="btn btn-primary" onclick="processLogin()">MASUK / DAFTAR</button>
                <p style="font-size: 0.75rem; text-align: center; margin-top: 20px; opacity: 0.4;">Secure By Ryzz CV</p>
            </div>
        </div>

        <div id="scr-home" class="screen">
            <div class="user-card">
                <div class="ava-frame" id="my-ava">👤</div>
                <div style="flex: 1;">
                    <b id="my-name" style="font-size: 1.1rem;">-</b><br>
                    <small id="my-lv" style="color: var(--accent);">Level 1</small>
                </div>
                <button onclick="nav('scr-profile')" style="background:none; border:none; color:var(--accent); font-size:1.5rem; cursor:pointer;">⚙️</button>
            </div>
            <h2>Pilih Mode Bermain</h2>
            <button class="btn btn-primary" onclick="startSoloMode()">RANK</button>
            <button class="btn" onclick="nav('scr-online-lobby')">MULTIPLAYER</button>
            <button class="btn" style="border-color: var(--gold); color: var(--gold);" onclick="openLeaderboard()">LEADERBOARD</button>
            <button class="btn btn-secondary" style="margin-top: 20px;" onclick="handleLogout()">LOGOUT</button>
        </div>

        <div id="scr-profile" class="screen">
            <h2>PENGATURAN PROFIL</h2>
            <div class="ava-frame" id="prev-ava" style="width:80px; height:80px; font-size:2.5rem; margin-bottom: 20px;">👤</div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;">
                <div onclick="setAva('👤')">👤</div><div onclick="setAva('🦊')">🦊</div>
                <div onclick="setAva('🥷')">🥷</div><div onclick="setAva('🤖')">🤖</div>
                <div onclick="setAva('👻')">👻</div><div onclick="setAva('🐱')">🐱</div>
                <div onclick="setAva('👽')">👽</div><div onclick="setAva('🦁')">🦁</div>
            </div>
            <p style="opacity: 0.5; font-size: 0.8rem;">ID: @<span id="my-id-fixed"></span></p>
            <input type="text" id="new-display-name" placeholder="Nama Baru">
            <button class="btn btn-primary" onclick="saveNewProfile()">Simpan</button>
            <button class="btn" onclick="nav('scr-home')">Kembali</button>
        </div>

        <div id="scr-leaderboard" class="screen">
            <h2 style="margin-bottom: 25px;">Pemain Terhebat</h2>
            <div id="lb-list-global" class="lb-list"></div>
            <div style="flex: 1;"></div>
            <button class="btn btn-secondary" onclick="back()">KEMBALI</button>
        </div>

        <div id="scr-online-lobby" class="screen">
            <h2>ONLINE ARENA</h2>
            <button class="btn btn-primary" onclick="createRoom()">Buat ROOM</button>
            <button class="btn" onclick="nav('scr-join-room')">Gabung ROOM</button>
            <button class="btn btn-secondary" onclick="nav('scr-home')">KEMBALI</button>
        </div>

        <div id="scr-join-room" class="screen">
            <h2>MASUKKAN KODE</h2>
            <input type="number" id="join-code" placeholder="Kode Arena">
            <button class="btn btn-primary" onclick="processJoin()">GABUNG</button>
            <button class="btn" onclick="nav('scr-online-lobby')">BATAL</button>
        </div>

        <div id="scr-waiting" class="screen">
            <h2>ROOM SIAP</h2>
            <p>ID Arena:</p>
            <h1 id="room-id-val" style="color: var(--accent); font-size: 4rem;">00000</h1>
            <button class="btn btn-primary" onclick="copyInviteLink()">SALIN KODE</button>
            <p style="font-style: italic; animation: pulse 1s infinite;">Menunggu lawan bergabung...</p>
        </div>

        <div id="scr-game" class="screen">
            <div id="game-info" style="font-weight: bold; margin-bottom: 10px;">SINKRONISASI...</div>
            <div class="game-grid">
                <div class="tile" onclick="makeMove(0)"></div>
                <div class="tile" onclick="makeMove(1)"></div>
                <div class="tile" onclick="makeMove(2)"></div>
                <div class="tile" onclick="makeMove(3)"></div>
                <div class="tile" onclick="makeMove(4)"></div>
                <div class="tile" onclick="makeMove(5)"></div>
                <div class="tile" onclick="makeMove(6)"></div>
                <div class="tile" onclick="makeMove(7)"></div>
                <div class="tile" onclick="makeMove(8)"></div>
            </div>
            <div id="social-tools" style="width: 100%;">
                <div style="display:flex; justify-content:center; gap:15px; margin-bottom: 10px;">
                    <span style="font-size:1.8rem; cursor:pointer;" onclick="sticker('🔥')">🔥</span>
                    <span style="font-size:1.8rem; cursor:pointer;" onclick="sticker('🤣')">🤣</span>
                    <span style="font-size:1.8rem; cursor:pointer;" onclick="sticker('🤫')">🤫</span>
                    <span style="font-size:1.8rem; cursor:pointer;" onclick="sticker('🤡')">🤡</span>
                </div>
                <div class="chat-box">
                    <div id="chat-content" class="chat-view"></div>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <input type="text" id="chat-in" placeholder="Ketik pesan..." style="flex:1;">
                        <button onclick="sendChat()" style="background:var(--accent); border:none; border-radius:12px; width:45px;">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAnO4RRw9Yy6qKDN98T-VgM8P4_IuA6zIs",
            authDomain: "chat-fathur-2026.firebaseapp.com",
            projectId: "chat-fathur-2026",
            databaseURL: "https://chat-fathur-2026-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player = null, roomCode = null, side = null, isTurn = false, vsAI = false, aiBoard = Array(9).fill(""), lastScr = 'scr-login', pickedAva = '👤';

        // AUTO LOGIN SESSION
        window.onload = function() {
            const u = localStorage.getItem('xox_u'), p = localStorage.getItem('xox_p');
            if(u && p) {
                document.getElementById('login-user').value = u;
                document.getElementById('login-pass').value = p;
                processLogin(true);
            }
        };

        function nav(id) {
            lastScr = document.querySelector('.screen.active').id;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function back() { nav(lastScr); }

        function processLogin(auto = false) {
            const u = document.getElementById('login-user').value.trim().toLowerCase();
            const p = document.getElementById('login-pass').value.trim();
            if(!u || !p) return alert("Isi semua data!");

            db.ref('players/' + u).once('value', snap => {
                let data;
                if(snap.exists()) {
                    data = snap.val();
                    if(data.pass !== p) return auto ? handleLogout() : alert("Password salah!");
                } else {
                    data = { username: u, name: u, pass: p, lv: 1, exp: 0, ava: '👤' };
                }
                
                // FORCE LEVEL UNTUK FATHURRIZAMREAL
                if(u === 'fathurrizamreal') data.lv = 670;
                
                db.ref('players/' + u).update(data);
                localStorage.setItem('xox_u', u);
                localStorage.setItem('xox_p', p);
                player = data;
                syncUI();
                nav('scr-home');
            });
        }

        function handleLogout() { localStorage.clear(); location.reload(); }
        function syncUI() {
            document.getElementById('my-ava').innerText = player.ava;
            document.getElementById('prev-ava').innerText = player.ava;
            document.getElementById('my-name').innerText = player.name;
            document.getElementById('my-lv').innerText = `Level ${player.lv} (${player.exp}/100 XP)`;
            document.getElementById('my-id-fixed').innerText = player.username;
            document.getElementById('new-display-name').value = player.name;
        }

        function setAva(a) { pickedAva = a; document.getElementById('prev-ava').innerText = a; }
        function saveNewProfile() {
            const n = document.getElementById('new-display-name').value.trim();
            if(!n) return;
            player.name = n; player.ava = pickedAva;
            db.ref('players/' + player.username).update({ name: n, ava: pickedAva });
            syncUI(); nav('scr-home');
        }

        // LEADERBOARD: REAL-TIME SORTING BY LEVEL
        function openLeaderboard() {
            nav('scr-leaderboard');
            const list = document.getElementById('lb-list-global');
            list.innerHTML = '<p>Loading Rank...</p>';
            
            db.ref('players').once('value', snap => {
                let players = [];
                snap.forEach(child => { players.push(child.val()); });
                
                // URUTKAN DARI LEVEL TERTINGGI KE TERENDAH
                players.sort((a, b) => b.lv - a.lv || b.exp - a.exp);

                list.innerHTML = '';
                players.forEach((p, i) => {
                    let rankIcon = i === 0 ? 'rank-1' : (i === 1 ? 'rank-2' : (i === 2 ? 'rank-3' : 'rank-other'));
                    let isMe = p.username === player.username ? 'highlight' : '';
                    
                    list.innerHTML += `
                        <div class="lb-row ${isMe}">
                            <div class="rank-badge ${rankIcon}">${i+1}</div>
                            <div class="ava-frame" style="width:40px; height:40px; font-size:1.1rem; box-shadow:none;">${p.ava}</div>
                            <div style="flex:1;">
                                <b>${p.name}</b><br><small>@${p.username}</small>
                            </div>
                            <div style="text-align:right; font-weight:800; color:var(--gold);">Lv ${p.lv}</div>
                        </div>`;
                });
            });
        }

        // SMART AI (MINIMAX)
        function startSoloMode() {
            vsAI = true; side = 'X'; aiBoard = Array(9).fill("");
            nav('scr-game');
            document.getElementById('social-tools').style.display = 'none';
            renderBoard(aiBoard, 'X');
        }

        function minimax(board, depth, isMax) {
            let res = checkWin(board);
            if (res === 'O') return 10 - depth;
            if (res === 'X') return depth - 10;
            if (res === 'Draw') return 0;
            if (isMax) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) if (board[i] === "") { board[i] = "O"; best = Math.max(best, minimax(board, depth + 1, false)); board[i] = ""; }
                return best;
            } else {
                let best = Infinity;
                for (let i = 0; i < 9; i++) if (board[i] === "") { board[i] = "X"; best = Math.min(best, minimax(board, depth + 1, true)); board[i] = ""; }
                return best;
            }
        }

        function aiPlay() {
            setTimeout(() => {
                let bestVal = -Infinity, move;
                for (let i = 0; i < 9; i++) if (aiBoard[i] === "") {
                    aiBoard[i] = "O"; let val = minimax(aiBoard, 0, false); aiBoard[i] = "";
                    if (val > bestVal) { bestVal = val; move = i; }
                }
                aiBoard[move] = 'O'; renderBoard(aiBoard, 'X');
            }, 600);
        }

        // ONLINE LOBBY
        function createRoom() {
            vsAI = false; roomCode = Math.floor(10000 + Math.random() * 90000).toString();
            side = 'X';
            db.ref('rooms/' + roomCode).set({ board: Array(9).fill(""), turn: 'X', status: 'wait', p1: player.username });
            document.getElementById('room-id-val').innerText = roomCode;
            nav('scr-waiting'); listenRoom();
        }

        function processJoin() {
            const id = document.getElementById('join-code').value;
            db.ref('rooms/' + id).once('value', snap => {
                if(snap.exists() && snap.val().status === 'wait') {
                    roomCode = id; side = 'O'; vsAI = false;
                    db.ref('rooms/' + id).update({ status: 'play', p2: player.username });
                    listenRoom();
                } else alert("Room tidak ditemukan!");
            });
        }

        function listenRoom() {
            db.ref('rooms/' + roomCode).on('value', snap => {
                const d = snap.val(); if(!d) return;
                if(d.status === 'play' || d.status === 'done') {
                    nav('scr-game');
                    document.getElementById('social-tools').style.display = 'block';
                    renderBoard(d.board, d.turn);
                    renderChats(d.chats);
                }
            });
        }

        function renderBoard(b, t) {
            const tiles = document.querySelectorAll('.tile');
            b.forEach((v, i) => { tiles[i].innerText = v; tiles[i].className = 'tile ' + v.toLowerCase(); });
            const win = checkWin(b);
            if(win) return finish(win);

            if(vsAI && t === 'O') {
                document.getElementById('game-info').innerText = "Giliran AI...";
                aiPlay(); isTurn = false;
            } else {
                isTurn = (t === side);
                document.getElementById('game-info').innerText = isTurn ? "Giliran Kamu" : "Giliran Lawan";
                document.getElementById('game-info').style.color = isTurn ? 'var(--accent)' : '#fff';
            }
        }

        function makeMove(i) {
            if(!isTurn) return;
            if(vsAI) { if(aiBoard[i]==="") { aiBoard[i]='X'; renderBoard(aiBoard, 'O'); } }
            else {
                db.ref('rooms/' + roomCode).once('value', snap => {
                    let b = snap.val().board;
                    if(b[i]==="") { b[i]=side; db.ref('rooms/' + roomCode).update({ board:b, turn:side==='X'?'O':'X' }); }
                });
            }
        }

        function finish(w) {
            const ov = document.getElementById('overlay-result');
            ov.style.display = 'flex';
            let xp = w === "Draw" ? 20 : (w === side ? 50 : 10);
            document.getElementById('win-status').innerText = w === "Draw" ? "SERI!" : (w === side ? "MENANG!" : "KALAH!");
            document.getElementById('reward-exp').innerText = `+${xp} XP`;
            updateExp(xp);
            if(!vsAI) db.ref('rooms/' + roomCode).update({ status: 'done' });
        }

        function updateExp(amt) {
            player.exp += amt;
            if(player.exp >= 100) { player.lv++; player.exp -= 100; }
            db.ref('players/' + player.username).update({ lv: player.lv, exp: player.exp });
            syncUI();
        }

        function exitToMenu() { document.getElementById('overlay-result').style.display = 'none'; nav('scr-home'); }
        function checkWin(b) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let l of lines) if(b[l[0]] && b[l[0]]==b[l[1]] && b[l[0]]==b[l[2]]) return b[l[0]];
            return b.includes("") ? null : "Draw";
        }

        function sendChat() {
            const m = document.getElementById('chat-in').value; if(!m) return;
            db.ref('rooms/' + roomCode + '/chats').push({ n: player.name, t: m });
            document.getElementById('chat-in').value = '';
        }
        function sticker(s) { db.ref('rooms/' + roomCode + '/chats').push({ n: player.name, t: s }); }
        function renderChats(c) {
            const l = document.getElementById('chat-content'); l.innerHTML = '';
            if(c) Object.values(c).forEach(m => { l.innerHTML += `<div><b>${m.n}:</b> ${m.t}</div>`; });
            l.scrollTop = l.scrollHeight;
        }
        function copyInviteLink() { navigator.clipboard.writeText(roomCode); alert("Kode disalin!"); }
    </script>
</body>
</html>
